<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flappy cat ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Tahoma, Arial, sans-serif;
}

body {
  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.95) 0 45px, transparent 46px),
    radial-gradient(circle at 82% 12%, rgba(255,255,255,.8) 0 70px, transparent 71px),
    linear-gradient(180deg, #ffdce9 0%, #e9a9c0 42%, #21181d 100%);
  overflow-x: hidden;
  color: #24191f;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .28;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 3px,
      rgba(255,255,255,.25) 4px
    ),
    radial-gradient(
      circle at 50% 100%,
      #fff 0 2px,
      transparent 3px
    );

  background-size: auto, 24px 24px;
}

.page {
  max-width: 1000px;
  margin: 28px auto;
  padding: 0 16px;
}

.window {
  background: #f8e8ee;
  border: 2px solid #4a3039;
  border-radius: 9px;

  box-shadow:
    inset 1px 1px white,
    inset -1px -1px #b58a99,
    0 10px 35px rgba(60,20,35,.28);

  overflow: hidden;
}

.titlebar {
  height: 38px;
  padding: 5px 7px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  color: white;

  font: bold 15px Tahoma, Arial, sans-serif;

  background:
    linear-gradient(
      #f3b3c9,
      #c76b8b 48%,
      #8b3f5c 52%,
      #4a2632
    );

  text-shadow: 1px 1px #3b1d29;
}

.titlebar .name {
  display: flex;
  gap: 8px;
  align-items: center;
}

.paw {
  width: 22px;
  height: 22px;
  border-radius: 6px;

  background: rgba(255,255,255,.8);
  color: #9b4767;

  display: grid;
  place-items: center;
}

.winbtns {
  display: flex;
  gap: 4px;
}

.winbtns span {
  width: 23px;
  height: 21px;

  display: grid;
  place-items: center;

  color: #4a2632;
  background: #f8dce6;

  border: 1px solid #815265;
  border-radius: 3px;

  box-shadow: inset 1px 1px white;
}

.toolbar {
  padding: 7px 10px;

  display: flex;
  gap: 7px;
  align-items: center;

  background: #efd1dc;
  border-bottom: 1px solid #bd8d9e;

  font-size: 12px;
}

.btn {
  border: 1px solid #805468;
  border-radius: 4px;

  background: linear-gradient(#fff, #f3d9e2);

  color: #56243a;

  padding: 5px 10px;

  cursor: pointer;

  box-shadow:
    inset 1px 1px white,
    1px 1px #bda2ac;
}

.btn:active {
  transform: translate(1px,1px);
  box-shadow: none;
}

.hint {
  margin-left: auto;
  color: #704c5a;
}

.lace {
  height: 17px;

  background:
    radial-gradient(
      circle at 8px 0,
      transparent 7px,
      #fff 7.5px 8.5px,
      transparent 9px
    ) 0 0 / 16px 16px repeat-x,

    repeating-linear-gradient(
      90deg,
      transparent 0 7px,
      #fff 7px 9px,
      transparent 9px 16px
    );

  opacity: .78;

  border-top: 1px solid rgba(100,55,70,.35);
}

.main {
  padding: 12px;

  background:
    linear-gradient(
      #fff4f8,
      #f1d9e2
    );
}

.gameShell {
  position: relative;

  border: 2px solid #4a3039;
  border-radius: 6px;

  overflow: hidden;

  background: #d99ab2;

  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.75),
    inset 0 0 30px rgba(70,20,40,.12);
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  image-rendering: pixelated;
}

.hud {
  position: absolute;

  top: 10px;
  left: 10px;
  right: 10px;

  display: flex;
  justify-content: space-between;

  pointer-events: none;
}

.badge {
  background: rgba(255,245,249,.9);

  border: 1px solid #a06b80;
  border-radius: 5px;

  padding: 6px 9px;

  box-shadow:
    2px 2px rgba(75,35,50,.25);

  font:
    16px "VT323",
    monospace;

  color: #71364f;
}

.start {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,225,235,.30);
}

.card {
  width: min(410px,86%);

  text-align: center;

  padding: 22px 20px;

  background: rgba(255,242,247,.94);

  border: 2px solid #8e5368;
  border-radius: 8px;

  box-shadow:
    inset 2px 2px white,
    5px 5px rgba(55,25,38,.22);
}

.card h1 {
  margin: 0 0 4px;

  font:
    42px "VT323",
    monospace;

  letter-spacing: 1px;

  color: #a04468;

  text-shadow:
    2px 2px #f2b9cd;
}

.card p {
  font:
    18px "VT323",
    monospace;

  margin: 8px 0 14px;

  color: #704d5a;
}

.play {
  font:
    bold 13px Tahoma,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      #fff,
      #f0b9ce
    );

  border:
    2px solid #81465d;

  border-radius: 5px;

  padding: 9px 18px;

  cursor: pointer;

  color: #612d43;

  box-shadow:
    inset 1px 1px white,
    2px 2px #b3919d;
}

.play:active {
  transform: translate(2px,2px);
  box-shadow: none;
}

#gameOver {
  display: none;
}

.bottom {
  padding: 9px 12px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  background: #ead0da;

  border-top: 1px solid #b68b9b;

  font-size: 11px;
  color: #684957;
}
</style>
</head>

<body>

<audio id="music" src="music.mp3" loop></audio>

<div class="page">

  <div class="window">

    <div class="titlebar">

      <div class="name">
        <span class="paw">♡</span>
        flappy cat
      </div>

      <div class="winbtns">
        <span>_</span>
        <span>□</span>
        <span>×</span>
      </div>

    </div>

    <div class="toolbar">

      <button class="btn" id="restart">
        ↻ New Game
      </button>

      <button class="btn" id="mute">
        ♫ Sound
      </button>

      <span class="hint">
        ← → move &nbsp; • &nbsp; SPACE hop
      </span>

    </div>

    <div class="lace"></div>

    <div class="main">

      <div class="gameShell">

        <canvas
          id="game"
          width="900"
          height="560">
        </canvas>

        <div class="hud">

          <div class="badge">
            SCORE
            <span id="score">0000</span>
          </div>

          <div class="badge">
            BEST
            <span id="best">0000</span>
          </div>

        </div>

        <div class="start" id="start">

          <div class="card">

            <h1>
              ♡ flappy cat ♡
            </h1>

            <p>
              help the little kitty hop through the sky!
            </p>

            <button
              class="play"
              id="play">

              START GAME

            </button>

          </div>

        </div>

        <div class="start" id="gameOver">

          <div class="card">

            <h1>
              oh no! ♡
            </h1>

            <p>
              the kitty fell...
            </p>

            <p>
              score:
              <span id="finalScore">0</span>
            </p>

            <button
              class="play"
              id="again">

              TRY AGAIN

            </button>

          </div>

        </div>

      </div>

    </div>

    <div class="lace"></div>

    <div class="bottom">

      <span>
        ♡ made for kitty lovers! have fun - r ♡
      </span>

      <span>
        rana a kitty_hop.exe
      </span>

    </div>

  </div>

</div>


<script>

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;


/* CAT */

const catImg = new Image();
catImg.src = "cat.png";


/* MUSIC */

const music =
  document.getElementById("music");

music.volume = 0.5;


/* GAME SIZE */

const W = canvas.width;
const H = canvas.height;


let running = false;
let gameOver = false;
let score = 0;

let best =
  Number(
    localStorage.getItem("kittyBest") || 0
  );


document.getElementById("best").textContent =
  String(best).padStart(4,"0");


const keys = {
  left: false,
  right: false
};


let cat;
let platforms;
let particles;
let cameraY;


/* RESET */

function reset() {

  score = 0;
  cameraY = 0;
  gameOver = false;

  cat = {
    x: 120,
    y: 434,
    w: 72,
    h: 66,
    vx: 0,
    vy: 0,
    onGround: true
  };

  platforms = [

    {
      x: 100,
      y: 500,
      w: 190,
      h: 18
    },

    {
      x: 280,
      y: 410,
      w: 165,
      h: 18
    },

    {
      x: 500,
      y: 320,
      w: 155,
      h: 18
    },

    {
      x: 315,
      y: 230,
      w: 155,
      h: 18
    },

    {
      x: 90,
      y: 140,
      w: 155,
      h: 18
    },

    {
      x: 300,
      y: 50,
      w: 155,
      h: 18
    }

  ];

  particles = [];

  nextPlatformIndex = 0;

  for (let i = 0; i < 8; i++) {
    addPlatformAbove();
  }

  document.getElementById("score").textContent =
    "0000";
}


/* PLATFORM PATTERN */

let nextPlatformIndex = 0;

const platformPattern = [

  {
    x: 500,
    w: 155
  },

  {
    x: 300,
    w: 150
  },

  {
    x: 90,
    w: 155
  },

  {
    x: 315,
    w: 150
  },

  {
    x: 540,
    w: 145
  },

  {
    x: 330,
    w: 150
  },

  {
    x: 100,
    w: 150
  },

  {
    x: 350,
    w: 145
  }

];


function addPlatformAbove() {

  const highest =
    Math.min(
      ...platforms.map(
        p => p.y
      )
    );

  const pattern =
    platformPattern[
      nextPlatformIndex % platformPattern.length
    ];

  const y =
    highest - 90;

  platforms.push({

    x: pattern.x,
    y: y,
    w: pattern.w,
    h: 18

  });

  nextPlatformIndex++;
}


/* START */

function startGame() {

  reset();

  running = true;

  document.getElementById("start")
    .style.display = "none";

  document.getElementById("gameOver")
    .style.display = "none";

  /* START MUSIC */

  if (!muted) {
    music.currentTime = 0;

    music.play().catch(function(error) {
      console.log("Music could not start:", error);
    });
  }
}


/* GAME OVER */

function endGame() {

  running = false;
  gameOver = true;

  /* STOP MUSIC */

  music.pause();
  music.currentTime = 0;

  best =
    Math.max(
      best,
      score
    );

  localStorage.setItem(
    "kittyBest",
    best
  );

  document.getElementById("best").textContent =
    String(best).padStart(4,"0");

  document.getElementById("finalScore")
    .textContent = score;

  document.getElementById("gameOver")
    .style.display = "flex";
}


/* JUMP WITH SPACE ONLY */

function hop() {

  if (!running) {
    return;
  }

  if (!cat.onGround) {
    return;
  }

  cat.vy = -13;
  cat.onGround = false;

  for (let i = 0; i < 5; i++) {

    particles.push({

      x:
        cat.x
        + cat.w / 2,

      y:
        cat.y
        + cat.h
        - 4,

      vx:
        (Math.random() - 0.5)
        * 2,

      vy:
        -Math.random() * 2
        - 1,

      life: 25

    });

  }
}


/* UPDATE */

function update() {

  if (!running) {
    return;
  }


  if (keys.left) {
    cat.vx -= 0.7;
  }

  if (keys.right) {
    cat.vx += 0.7;
  }


  cat.vx *= 0.88;


  cat.vx =
    Math.max(
      -6,
      Math.min(
        6,
        cat.vx
      )
    );


  const oldBottom =
    cat.y + cat.h;


  cat.vy += 0.62;

  cat.x += cat.vx;
  cat.y += cat.vy;


  /* SCREEN WRAP */

  if (cat.x < -cat.w) {
    cat.x = W;
  }

  if (cat.x > W) {
    cat.x = -cat.w;
  }


  cat.onGround = false;


  /* PLATFORM COLLISION */

  if (cat.vy > 0) {

    for (const p of platforms) {

      const touching =
        cat.x + cat.w - 12 > p.x &&
        cat.x + 12 < p.x + p.w &&
        oldBottom <= p.y &&
        cat.y + cat.h >= p.y;


      if (touching) {

        cat.y =
          p.y - cat.h;

        cat.vy = 0;

        cat.onGround = true;

        score++;

        document.getElementById("score")
          .textContent =
          String(score).padStart(4,"0");

        break;
      }
    }
  }


  /* CAMERA */

  if (cat.y < 210) {

    const shift =
      210 - cat.y;

    cat.y = 210;

    for (const p of platforms) {
      p.y += shift;
    }

    cameraY += shift;

  }


  platforms =
    platforms.filter(
      p => p.y < H + 80
    );


  while (platforms.length < 11) {
    addPlatformAbove();
  }


  /* PARTICLES */

  for (const q of particles) {

    q.x += q.vx;
    q.y += q.vy;
    q.life--;

  }


  particles =
    particles.filter(
      q => q.life > 0
    );


  if (cat.y > H + 70) {
    endGame();
  }
}


/* ROUNDED RECTANGLE */

function roundRect(
  x,
  y,
  w,
  h,
  r
) {

  ctx.beginPath();

  ctx.moveTo(
    x + r,
    y
  );

  ctx.arcTo(
    x + w,
    y,
    x + w,
    y + h,
    r
  );

  ctx.arcTo(
    x + w,
    y + h,
    x,
    y + h,
    r
  );

  ctx.arcTo(
    x,
    y + h,
    x,
    y,
    r
  );

  ctx.arcTo(
    x,
    y,
    x + w,
    y,
    r
  );

  ctx.closePath();
}


/* BACKGROUND */

function drawBackground() {

  const g =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  g.addColorStop(
    0,
    "#ffdce9"
  );

  g.addColorStop(
    0.62,
    "#d98fa8"
  );

  g.addColorStop(
    1,
    "#21181d"
  );

  ctx.fillStyle = g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  const sun =
    ctx.createRadialGradient(
      760,
      90,
      10,
      760,
      90,
      100
    );

  sun.addColorStop(
    0,
    "rgba(255,255,255,.95)"
  );

  sun.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle = sun;

  ctx.fillRect(
    650,
    0,
    220,
    200
  );


  const clouds = [
    [80,90,1],
    [470,80,.8],
    [760,190,.9],
    [190,320,.75]
  ];


  for (
    const [x,y,s]
    of clouds
  ) {

    ctx.fillStyle =
      "rgba(255,255,255,.88)";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      28 * s,
      0,
      Math.PI * 2
    );

    ctx.arc(
      x + 28 * s,
      y - 12 * s,
      35 * s,
      0,
      Math.PI * 2
    );

    ctx.arc(
      x + 64 * s,
      y,
      25 * s,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillRect(
      x,
      y,
      65 * s,
      25 * s
    );
  }


  ctx.fillStyle =
    "rgba(255,220,233,.34)";

  ctx.beginPath();

  ctx.moveTo(
    0,
    H
  );

  ctx.quadraticCurveTo(
    140,
    390,
    280,
    H
  );

  ctx.quadraticCurveTo(
    450,
    400,
    620,
    H
  );

  ctx.quadraticCurveTo(
    760,
    410,
    900,
    H
  );

  ctx.fill();


  for (let i = 0; i < 22; i++) {

    const x =
      (i * 137) % W;

    const y =
      (i * 83 + cameraY * .22)
      % H;

    ctx.fillStyle =
      "rgba(255,255,255,.65)";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      2 + (i % 3),
      0,
      Math.PI * 2
    );

    ctx.fill();
  }
}


/* PLATFORM */

function drawPlatform(p) {

  ctx.fillStyle =
    "rgba(55,25,38,.20)";

  roundRect(
    p.x + 4,
    p.y + 5,
    p.w,
    18,
    6
  );

  ctx.fill();


  const g =
    ctx.createLinearGradient(
      0,
      p.y,
      0,
      p.y + 18
    );

  g.addColorStop(
    0,
    "#ffffff"
  );

  g.addColorStop(
    .45,
    "#ffe5ee"
  );

  g.addColorStop(
    .5,
    "#e3a2b8"
  );

  g.addColorStop(
    1,
    "#a95f79"
  );


  ctx.fillStyle = g;

  roundRect(
    p.x,
    p.y,
    p.w,
    18,
    5
  );

  ctx.fill();


  ctx.strokeStyle =
    "#713d52";

  ctx.lineWidth = 1.5;

  ctx.stroke();


  ctx.fillStyle =
    "rgba(255,255,255,.9)";


  for (
    let x = p.x + 7;
    x < p.x + p.w - 3;
    x += 14
  ) {

    ctx.beginPath();

    ctx.arc(
      x,
      p.y + 18,
      5,
      0,
      Math.PI
    );

    ctx.fill();
  }
}


/* CAT */

function drawCat() {

  ctx.fillStyle =
    "rgba(55,25,38,.18)";

  ctx.beginPath();

  ctx.ellipse(
    cat.x + cat.w / 2,
    cat.y + cat.h + 4,
    25,
    5,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  if (
    catImg.complete &&
    catImg.naturalWidth > 0
  ) {

    ctx.drawImage(
      catImg,
      cat.x,
      cat.y,
      cat.w,
      cat.h
    );

  } else {

    ctx.fillStyle =
      "#222";

    ctx.fillRect(
      cat.x + 12,
      cat.y + 12,
      48,
      45
    );
  }


  ctx.fillStyle =
    "#fff";

  ctx.font =
    "18px Arial";


  if (
    Math.floor(
      Date.now() / 250
    ) % 2 === 0
  ) {

    ctx.fillText(
      "✦",
      cat.x + cat.w + 3,
      cat.y + 10
    );
  }
}


/* PARTICLES */

function drawParticles() {

  for (
    const q of particles
  ) {

    ctx.fillStyle =
      `rgba(255,255,255,${q.life / 25})`;

    ctx.fillRect(
      q.x,
      q.y,
      4,
      4
    );
  }
}


/* DRAW */

function draw() {

  drawBackground();

  for (
    const p of platforms
  ) {

    drawPlatform(p);

  }

  drawParticles();

  drawCat();
}


/* GAME LOOP */

function loop() {

  update();

  draw();

  requestAnimationFrame(loop);
}


/* KEYBOARD DOWN */

document.addEventListener(
  "keydown",
  function(e) {

    if (e.code === "ArrowLeft") {

      keys.left = true;

      e.preventDefault();
    }


    if (e.code === "ArrowRight") {

      keys.right = true;

      e.preventDefault();
    }


    /* SPACE IS THE ONLY JUMP BUTTON */

    if (e.code === "Space") {

      e.preventDefault();

      if (!e.repeat) {
        hop();
      }

    }

  }
);


/* KEYBOARD UP */

document.addEventListener(
  "keyup",
  function(e) {

    if (e.code === "ArrowLeft") {

      keys.left = false;

      e.preventDefault();
    }

    if (e.code === "ArrowRight") {

      keys.right = false;

      e.preventDefault();
    }

  }
);


/* BUTTONS */

document.getElementById("play")
  .addEventListener(
    "click",
    startGame
  );


document.getElementById("again")
  .addEventListener(
    "click",
    startGame
  );


document.getElementById("restart")
  .addEventListener(
    "click",
    startGame
  );


/* SOUND */

let muted = false;

document.getElementById("mute")
  .addEventListener(
    "click",
    function() {

      muted = !muted;

      if (muted) {

        music.pause();

        document.getElementById("mute")
          .textContent = "♫ Muted";

      } else {

        document.getElementById("mute")
          .textContent = "♫ Sound";

        if (running) {

          music.play().catch(function(error) {
            console.log("Music could not start:", error);
          });

        }

      }

    }
  );


/* START GAME */

reset();

loop();

</script>

</body>
</html>
